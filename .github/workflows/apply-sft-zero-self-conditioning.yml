name: Apply SFT exact-zero self-conditioning fix

on:
  push:
    branches:
      - fix-sft-zero-self-conditioning

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-sft-zero-self-conditioning
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix and regression tests
        run: python -c "import base64; exec(base64.b64decode(' '))"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format changed files
        run: pyink gemma/diffusion/hackable_diffusion_adapter/hd/hd_gemma_network.py gemma/diffusion/hackable_diffusion_adapter/hd/sft_model.py gemma/diffusion/hackable_diffusion_adapter/hd/sft_model_test.py
      - name: Run targeted SFT tests
        run: python -m pytest gemma/diffusion/hackable_diffusion_adapter/hd/sft_model_test.py -q
      - name: Verify formatting
        run: pyink --check gemma/diffusion/hackable_diffusion_adapter/hd/hd_gemma_network.py gemma/diffusion/hackable_diffusion_adapter/hd/sft_model.py gemma/diffusion/hackable_diffusion_adapter/hd/sft_model_test.py
      - name: Commit tested fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-sft-zero-self-conditioning.yml
          git add gemma/diffusion/hackable_diffusion_adapter/hd/hd_gemma_network.py gemma/diffusion/hackable_diffusion_adapter/hd/sft_model.py gemma/diffusion/hackable_diffusion_adapter/hd/sft_model_test.py
          git commit -m 'Preserve exact-zero SFT self-conditioning'
          git push origin HEAD:fix-sft-zero-self-conditioning
